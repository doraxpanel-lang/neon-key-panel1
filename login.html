
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOKI PANEL | Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#080b12;color:#f4f7ff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:22px}
.login{width:100%;max-width:410px;background:#0d121c;border:1px solid #202b3b;border-radius:22px;padding:30px 22px;box-shadow:0 0 35px #00d9ff13}
.logo{text-align:center;margin-bottom:28px}
.shield{font-size:52px;filter:drop-shadow(0 0 12px #00e5ff)}
h1{text-align:center;font-size:27px;letter-spacing:2px;margin:10px 0;color:#fff}
h1 span{color:#00e5ff}
.subtitle{text-align:center;color:#91a1b8;letter-spacing:4px;font-size:11px;margin-bottom:30px}
label{display:block;color:#a9b8ce;font-size:13px;margin:15px 0 8px}
input{width:100%;padding:15px;background:#03060b;border:1px solid #303846;border-radius:12px;color:white;font-size:16px;outline:none}
input:focus{border-color:#00e5ff}
button{width:100%;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:bold;background:linear-gradient(90deg,#00d9ff,#19e6b3);color:#041018;margin-top:22px}
.links{text-align:center;margin-top:22px;line-height:2;color:#00e5ff}
a{color:#00e5ff;text-decoration:none}
.note{text-align:center;color:#73839a;font-size:12px;margin-top:25px}
#message{font-size:13px;overflow-wrap:anywhere;color:#ff8d9b;margin-top:14px}
</style>
</head>
<body>
<main class="login">
  <div class="logo">
    <div class="shield">🛡️</div>
    <h1>LOKI <span>PANEL</span></h1>
    <div class="subtitle">AUTHORIZE ACCESS</div>
  </div>
  <form id="loginForm">
    <label for="email">EMAIL ADDRESS</label>
    <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
    <label for="password">PASSWORD</label>
    <input id="password" type="password" placeholder="Your password" autocomplete="current-password" required>
    <button type="submit">LOGIN NOW</button>
    <div id="message" role="status"></div>
  </form>
  <div class="links">
    <a href="signup.html">New User? Create Account</a><br>
    <a href="reset-password.html">Forgot Password?</a><br>
    <a href="index.html">← Back to Home</a>
  </div>
  <div class="note">SECURE DIGITAL RESELLER PANEL</div>
</main>
<script src="auth.js"></script>
</body>
</html>
