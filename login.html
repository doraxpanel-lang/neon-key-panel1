<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOKI PANEL | Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#080b12;color:#f4f7ff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.login{width:100%;max-width:420px;background:#0d121c;border:1px solid #202b3b;border-radius:22px;padding:30px 22px;box-shadow:0 0 30px #00e5ff12}
h1{text-align:center;color:#00e5ff;letter-spacing:2px}
.subtitle{text-align:center;color:#aab4c8;margin:24px 0}
label{display:block;margin:15px 0 8px;color:#a9b8ce;font-size:13px}
input{display:block;width:100%;padding:16px;background:#03060b;border:1px solid #303846;border-radius:12px;color:white;font-size:16px;margin-bottom:14px}
button{width:100%;padding:16px;border:0;border-radius:12px;background:#00d9ee;color:#061019;font-size:17px;font-weight:bold;cursor:pointer}
.links{text-align:center;margin-top:24px;line-height:2.2}
a{color:#00e5ff;text-decoration:none}
#authMessage{font-size:14px;overflow-wrap:anywhere;margin-top:14px;color:#ffb8b8}
</style>
</head>
<body>
<main class="login" id="authScreen">
<h1>🛡️ LOKI PANEL</h1>
<div class="subtitle" id="authSubtitle">AUTHORIZE ACCESS</div><form id="authForm">
<div id="usernameField" hidden>
<label for="authUsername">USERNAME</label>
<input id="authUsername" type="text" placeholder="Choose a username" minlength="3" autocomplete="username">
</div><label for="authEmail">EMAIL ADDRESS</label>
<input id="authEmail" type="email" placeholder="you@example.com" autocomplete="email" required>

<label for="authPassword">PASSWORD</label>
<input id="authPassword" type="password" placeholder="Minimum 8 characters" minlength="8" autocomplete="current-password" required>

<button id="authSubmit" type="submit">LOGIN NOW</button>

<div id="authMessage" role="status" aria-live="polite"></div>
</form><div class="links">
<a href="reset-password.html" id="authForgot">Forgot Password?</a><br>
<a href="#" id="authSwitch">New User? Create Account</a><br>
<a href="index.html">Back to Home</a>
</div>
</main><script src="auth.js"></script></body>
</html>
