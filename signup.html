<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LOKI PANEL | Create Account</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#080b12;color:#f4f7ff;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:420px;background:#0d121c;border:1px solid #202b3b;border-radius:22px;padding:30px 22px;text-align:center}
h1{color:#00e5ff;letter-spacing:2px;margin:0 0 12px}
p{color:#aab4c8;margin-bottom:25px}
input{display:block;width:100%;padding:16px;margin:14px 0;background:#03060b;border:1px solid #303846;border-radius:12px;color:white;font-size:16px}
button{width:100%;padding:16px;margin-top:10px;border:0;border-radius:12px;background:#00d9ee;color:#061019;font-size:17px;font-weight:bold}
a{display:inline-block;margin-top:22px;color:#00e5ff;text-decoration:none}
#message{margin-top:15px;overflow-wrap:anywhere}
</style>
</head>
<body>
<main class="card">
<h1>🛡️ LOKI PANEL</h1>
<p>CREATE YOUR ACCOUNT</p>
<form id="signupForm">
<input id="username" placeholder="Username" required minlength="3" autocomplete="username">
<input id="email" type="email" placeholder="Email address" required autocomplete="email">
<input id="password" type="password" placeholder="Password (minimum 8 characters)" required minlength="8" autocomplete="new-password">
<button type="submit">CREATE ACCOUNT</button>
</form>
<div id="message" role="status"></div>
<a href="login.html">Already have an account? Login</a><br>
<a href="index.html">Back to Home</a>
</main>
<script src="auth.js"></script>
</body>
</html>
